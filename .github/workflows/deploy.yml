name: Deploy House Price MLOps

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build -t kapil750/house-price-api:latest .

      - name: Push Docker image
        run: |
          docker push kapil750/house-price-api:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull kapil750/house-price-api:latest

            docker stop house-price-api || true
            docker rm house-price-api || true

            docker run -d \
              --name house-price-api \
              -p 8000:8000 \
              -e MLFLOW_TRACKING_URI=http://127.0.0.1:5000 \
              --restart unless-stopped \
              kapil750/house-price-api:latest